<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="etw menu bar.css" />
    <style>
      /* EMI Calculator Styling */
      .emi-calculator {
        background: #ffffff;
        margin: 50px auto;
        padding: 30px;
        width: 400px;
        border-radius: 15px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
      }

      .emi-calculator h2 {
        text-align: center;
        color: #219653;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin: 10px 0 5px;
        color: #333;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .bcb {
        width: 100%;
        padding: 12px;
        background-color: #219653;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
      }

      .bcb button:hover {
        background-color: #1a7a44;
      }

      .result {
        margin-top: 20px;
        text-align: center;
        background: #eafaf1;
        padding: 15px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>💰 Tracker</h2>
      <li><a href="etw home page.html">🏠 Dashboard</a></li>
      <li><a href="etw adder page.html">⚡ Quick Add Expense</a></li>
      <li><a href="etw delete page.html">❌ Delete Expense</a></li>
      <li><a href="etw calculator.html">🧮 Calculator</a></li>
      <li><a href="etw allexpense page.html">📑 All Expenses</a></li>
      <li><a href="etw pay page.html">💳 Pay later</a></li>
      <li><a href="etw charts page.html">📊 Charts</a></li>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div class="topbar">
        <button
          class="icon"
          onclick="window.location.href='etw adder page.html'"
        >
          ➕
        </button>
        <button
          title="Profile"
          onclick="window.location.href='etw profile page.html'"
        >
          👤
        </button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <!-- EMI Calculator -->
      <div class="emi-calculator">
        <h2>EMI Calculator</h2>
        <label>Loan Amount (₹)</label>
        <input type="number" id="loanAmount" placeholder="Enter loan amount" />

        <label>Annual Interest Rate (%)</label>
        <input
          type="number"
          id="interestRate"
          placeholder="Enter interest rate"
          step="0.01"
        />

        <label>Loan Tenure (Years)</label>
        <input type="number" id="loanTenure" placeholder="Enter loan tenure" />

        <button class="bcb" onclick="calculateEMI()">Calculate EMI</button>

        <div class="result" id="result">
          <p>Monthly EMI: ₹0</p>
        </div>
      </div>
    </div>

    <script>
      function logout() {
        localStorage.removeItem("user");
        window.location.href = "etw signup page.html";
      }
      function calculateEMI() {
        const principal = parseFloat(
          document.getElementById("loanAmount").value
        );
        const annualRate = parseFloat(
          document.getElementById("interestRate").value
        );
        const years = parseFloat(document.getElementById("loanTenure").value);

        if (
          isNaN(principal) ||
          isNaN(annualRate) ||
          isNaN(years) ||
          principal <= 0 ||
          annualRate <= 0 ||
          years <= 0
        ) {
          alert("⚠️ Please enter valid positive numbers for all fields.");
          return;
        }

        const monthlyRate = annualRate / 12 / 100;
        const months = years * 12;

        const emi =
          (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) /
          (Math.pow(1 + monthlyRate, months) - 1);

        document.getElementById(
          "result"
        ).innerHTML = `<p><strong>Monthly EMI:</strong> ₹${emi.toFixed(2)}</p>`;
      }
    </script>
  </body>
</html>
