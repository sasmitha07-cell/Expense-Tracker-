<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Expense Tracker</title>

    <style>
      :root {
        --primary: #2e7d32;
        --primary-dark: #1b5e20;
        --accent: #66bb6a;
        --light-bg: #f7f9fb;
        --shadow: rgba(0, 0, 0, 0.15);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-card {
        background: white;
        border-radius: 20px;
        padding: 2.8rem;
        width: 380px;
        text-align: center;
        box-shadow: 0 8px 25px var(--shadow);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .login-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px var(--shadow);
      }

      h2 {
        color: var(--primary-dark);
        font-size: 1.9rem;
        margin-bottom: 1.5rem;
      }

      p.subtitle {
        color: #666;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 1rem;
        transition: border 0.3s;
      }

      input:focus {
        border-color: var(--primary);
        outline: none;
      }

      button {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px;
        margin-top: 10px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s ease, transform 0.2s;
      }

      button:hover {
        background: var(--accent);
        transform: translateY(-2px);
      }

      .error {
        color: red;
        font-size: 0.9rem;
        margin-top: 10px;
      }

      .signup-link {
        margin-top: 1.5rem;
        font-size: 0.95rem;
      }

      .signup-link a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.3s;
      }

      .signup-link a:hover {
        color: var(--accent);
      }

      .logo {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <div class="logo">💰</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to track your expenses smartly</p>

      <form id="loginForm">
        <input
          type="text"
          id="usernameOrEmail"
          placeholder="Username or Email"
          required
        />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <div class="error" id="errorMsg"></div>

        <div class="signup-link">
          Don't have an account?
          <a href="etw login page.html">Sign Up</a>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const usernameOrEmail = document
            .getElementById("usernameOrEmail")
            .value.trim();
          const password = document.getElementById("password").value.trim();
          const errorMsg = document.getElementById("errorMsg");

          if (!usernameOrEmail || !password) {
            errorMsg.textContent = "⚠️ Please fill in all fields.";
            return;
          }

          try {
            const res = await fetch("http://localhost:5000/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ usernameOrEmail, password }),
            });

            const data = await res.json();

            if (res.ok) {
              // ✅ Store user info in localStorage
              localStorage.setItem("userId", data.user.id);
              localStorage.setItem("userDetails", JSON.stringify(data.user));

              // ✅ Redirect to all expense page
              window.location.href = "etw home page.html";
            } else {
              errorMsg.textContent = data.error || "Invalid login credentials.";
            }
          } catch (error) {
            console.error("Error:", error);
            errorMsg.textContent = "❌ Unable to connect to server.";
          }
        });
    </script>
  </body>
</html>
