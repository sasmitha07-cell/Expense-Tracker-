<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finance Calculators</title>
    <link rel="stylesheet" href="etw menu bar.css" />

    <style>
      /* ---------- GLOBAL ---------- */
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #f1f5f9;
        display: flex;
      }

      a {
        text-decoration: none;
      }
      /* ---------- CONTENT AREA ---------- */
      .calculator-container {
        padding: 20px;
        text-align: center;
      }

      .calculator-container h2 {
        font-size: 2.4rem;
        color: #067042;
        margin-bottom: 35px;
        font-weight: 700;
      }

      /* ---------- GRID ---------- */
      .calculator-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
        max-width: 950px;
        margin: 0 auto;
      }

      /* ---------- CARDS ---------- */
      .calculator-card {
        background: white;
        padding: 35px 20px;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.3s ease;
        cursor: pointer;
      }

      .calculator-card span {
        font-size: 3.5rem;
        margin-bottom: 12px;
        color: #067042;
      }

      .calculator-card p {
        font-size: 1.2rem;
        font-weight: 600;
        margin: 0;
        color: #333;
      }

      .calculator-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 28px rgba(6, 112, 66, 0.25);
        background: #e8fff4;
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>💰 Tracker</h2>
      <ul>
        <li><a href="etw home page.html">🏠 Dashboard</a></li>
        <li><a href="etw adder page.html">⚡ Quick Add Expense</a></li>
        <li><a href="etw delete page.html">❌ Delete Expense</a></li>
        <li><a href="etw calculator.html">🧮 Calculator</a></li>
        <li><a href="etw allexpense page.html">📑 All Expenses</a></li>
        <li><a href="etw pay page.html">💳 Pay later</a></li>
        <li><a href="etw charts page.html">📊 Charts</a></li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <button title="Add Expense">➕</button>
        <button
          title="Profile"
          onclick="window.location.href='etw profile page.html'"
        >
          👤
        </button>
        <button onclick="logout()">Logout</button>
      </div>

      <div class="calculator-container">
        <h2>Finance Calculators</h2>

        <div class="calculator-grid">
          <a href="etw loan calculator.html">
            <div class="calculator-card">
              <span>🏦</span>
              <p>Loan Calculator</p>
            </div>
          </a>

          <a href="etw interest calculator.html">
            <div class="calculator-card">
              <span>📈</span>
              <p>Interest Calculator</p>
            </div>
          </a>

          <a href="etw budget calculator.html">
            <div class="calculator-card">
              <span>📊</span>
              <p>Budget Calculator</p>
            </div>
          </a>

          <a href="etw emi calculator.html">
            <div class="calculator-card">
              <span>🗓️</span>
              <p>EMI Calculator</p>
            </div>
          </a>
        </div>
      </div>
    </div>

    <script>
      function logout() {
        localStorage.removeItem("user");
        window.location.href = "etw signup page.html";
      }
    </script>
  </body>
</html>
