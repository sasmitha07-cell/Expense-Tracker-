<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile - Expense Tracker</title>
    <link rel="stylesheet" href="etw menu bar.css" />
    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background-color: #f8fafc;
        display: flex;
      }
      .container {
        max-width: 600px;
        background: white;
        margin: 30px auto;
        border-radius: 15px;
        padding: 35px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      h2 {
        color: #111212;
        text-align: center;
        margin-bottom: 25px;
      }

      input,
      select,
      .bcb {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 1rem;
        box-sizing: border-box;
      }

      input:focus,
      select:focus {
        border-color: #219653;
        outline: none;
        box-shadow: 0 0 5px rgba(33, 150, 83, 0.4);
      }

      .bcb {
        background-color: #219653;
        color: white;
        border: none;
        transition: 0.3s;
      }

      .bcb:hover {
        background-color: #197c44;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <h2>💰 Tracker</h2>
      <ul>
        <li><a href="etw home page.html">🏠 Dashboard</a></li>
        <li><a href="etw adder page.html">⚡ Quick Add Expense</a></li>
        <li><a href="etw delete page.html">❌ Delete Expense</a></li>
        <li><a href="etw calculator.html">🧮 Calculator</a></li>
        <li><a href="etw allexpense page.html">📑 All Expenses</a></li>
        <li><a href="etw pay page.html">💳 Pay Later</a></li>
        <li><a href="etw charts page.html">📊 Charts</a></li>
      </ul>
    </aside>

    <div class="main">
      <div class="topbar">
        <button
          onclick="window.location.href='etw adder page.html'"
          title="Add Expense"
        >
          ➕
        </button>
        <button
          title="Profile"
          onclick="window.location.href='etw profile page.html'"
        >
          👤
        </button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="container">
        <h2>Edit Profile</h2>
        <form id="editForm">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="text" id="username" placeholder="Username" required />
          <input type="email" id="email" placeholder="Email Address" required />
          <input
            type="number"
            id="age"
            placeholder="Age"
            min="10"
            max="99"
            required
          />
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <button class="bcb" type="submit">Save Changes</button>
        </form>
      </div>
    </div>

    <script>
      const userId = localStorage.getItem("userId");
      function logout() {
        localStorage.removeItem("user");
        window.location.href = "etw signup page.html";
      }
      async function loadUser() {
        const res = await fetch(`http://localhost:5000/user/${userId}`);
        const user = await res.json();

        document.getElementById("name").value = user.name;
        document.getElementById("username").value = user.username;
        document.getElementById("email").value = user.email;
        document.getElementById("age").value = user.age;
        document.getElementById("gender").value = user.gender;
      }

      loadUser();

      document
        .getElementById("editForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const updatedData = {
            name: document.getElementById("name").value.trim(),
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            age: document.getElementById("age").value.trim(),
            gender: document.getElementById("gender").value,
          };

          const res = await fetch(`http://localhost:5000/user/${userId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedData),
          });

          const data = await res.json();

          if (res.ok) {
            alert(data.message);
            localStorage.setItem("userDetails", JSON.stringify(updatedData));
            window.location.href = "etw profile page.html";
          } else {
            alert("❌ Update failed: " + data.error);
          }
        });
    </script>
  </body>
</html>
